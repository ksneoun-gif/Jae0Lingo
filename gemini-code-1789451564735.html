<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>재오링고 (Jae-O-Lingo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; user-select: none; }
        
        /* 가로 스크롤/여백 원천 차단 */
        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0f172a; 
            overflow-x: hidden; 
            overscroll-behavior-x: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* 모바일 프레임 고정 (2D 평면) */
        .mobile-shell {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow-x: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* 2D 맵 스크롤 뷰포트 */
        #mapViewport {
            flex: 1;
            overflow-y: auto;      
            overflow-x: hidden;
            scroll-behavior: auto; 
            background: linear-gradient(to bottom, #1e293b, #bae6fd);
        }

        /* 2D 월드 */
        #mapWorld {
            position: relative;
            width: 100%;
            height: 3800px; 
            padding-bottom: 250px;     
            margin-top: 150px;         
        }

        .biome-map {
            background: linear-gradient(180deg, 
                #450a0a 0%, #7f1d1d 15%, #0284c7 35%, 
                #38bdf8 55%, #15803d 75%, #22c55e 100%
            );
        }

        /* 공통 UI 버튼 */
        .duo-btn { transition: all 0.15s; border-bottom: 4px solid rgba(0,0,0,0.2); }
        .duo-btn:active { transform: translateY(4px); border-bottom-width: 0px; margin-bottom: 4px; }
        .duo-btn:disabled { transform: none; border-bottom-width: 4px; opacity: 0.5; cursor: not-allowed; }

        .option-card { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); border-bottom: 4px solid #e2e8f0; }
        .option-card:active { transform: scale(0.96); border-bottom-width: 2px; }
        .selected { border-color: #3b82f6 !important; background-color: #eff6ff !important; border-width: 2px !important; border-bottom: 4px solid #1d4ed8 !important; color: #1d4ed8; }

        /* 스테이지 원형 노드 (2D) */
        .stage-btn {
            width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 900; border: 4px solid #ffffff; transition: transform 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .stage-btn.locked { background: #94a3b8; color: #cbd5e1; border-color: #cbd5e1; }
        .stage-btn.cleared { background: #eab308; color: #ffffff; border-color: #fef08a; }
        .stage-btn.current { background: #3b82f6; color: #ffffff; border-color: #bfdbfe; animation: pulse 1.5s infinite; }
        .stage-btn.boss { width: 84px; height: 84px; border-radius: 20px; }
        .stage-btn.boss.current { background: #ef4444; border-color: #fecaca; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* 맵 아바타 걷는 애니메이션 */
        .avatar-walk { animation: avatarHop 0.35s infinite alternate; }
        @keyframes avatarHop { from { transform: translateY(0); } to { transform: translateY(-20px); } }

        /* 전투 애니메이션 - 몬스터 피격 & 공격 */
        #battleMonster { font-size: 85px; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2)); transition: all 0.3s; }
        .monster-hit { animation: monsterOuch 0.4s ease; }
        @keyframes monsterOuch {
            0%, 100% { transform: scale(1) translateX(0); filter: brightness(1); }
            30% { transform: scale(0.9) translateX(-15px) rotate(-10deg); filter: brightness(0.4) sepia(1) hue-rotate(-50deg) saturate(6); }
            70% { transform: scale(0.9) translateX(15px) rotate(10deg); }
        }
        
        .monster-attack { animation: monsterLunge 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes monsterLunge {
            0% { transform: scale(1) translateY(0); }
            30% { transform: scale(0.9) translateY(-10px); }
            60% { transform: scale(1.5) translateY(30px); filter: brightness(1.2) drop-shadow(0 30px 20px rgba(0,0,0,0.4)); }
            100% { transform: scale(1) translateY(0); }
        }

        /* 플레이어 피격 (화면 진동 및 붉은 섬광) */
        .player-damage { animation: screenShake 0.4s ease-in-out; }
        @keyframes screenShake {
            0%, 100% { transform: translateX(0) rotate(0); box-shadow: inset 0 0 0 rgba(225,29,72,0); }
            20% { transform: translateX(-12px) rotate(-1.5deg); box-shadow: inset 0 0 80px rgba(225,29,72,0.6); }
            40% { transform: translateX(12px) rotate(1.5deg); }
            60% { transform: translateX(-12px) rotate(-1.5deg); box-shadow: inset 0 0 80px rgba(225,29,72,0.6); }
            80% { transform: translateX(12px) rotate(1.5deg); }
        }

        .hp-bar-inner { transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.4s; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-shell">

        <!-- ================= 화면 1: 로그인 ================= -->
        <div id="screenStart" class="flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-blue-500 to-sky-900 text-white z-50">
            <div class="flex-1 flex flex-col items-center justify-center text-center">
                <!-- 사슴 아바타 (자연스러운 이모지) -->
                <div class="text-8xl mb-4 animate-bounce drop-shadow-lg">🦌</div>
                <h1 class="text-4xl font-black tracking-tight mb-2 drop-shadow-md">재오링고</h1>
                <p class="text-sky-200 text-sm font-bold">에디와 함께하는 회계 모험</p>
            </div>
            <div class="bg-white/95 backdrop-blur p-6 rounded-3xl text-gray-800 shadow-2xl">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">모험가 닉네임</label>
                <input id="inputPlayerName" type="text" placeholder="이름을 입력하세요" class="w-full p-4 mb-4 border-2 border-slate-200 rounded-2xl bg-slate-50 focus:bg-white focus:border-blue-500 font-bold outline-none text-center text-lg">
                <button onclick="handleGameStart()" class="duo-btn w-full bg-blue-600 text-white font-black text-lg py-4 rounded-2xl">모험 떠나기 🚀</button>
            </div>
        </div>

        <!-- ================= 화면 2: 2D 월드 맵 (스크롤 가능) ================= -->
        <div id="screenMap" class="hidden flex-1 flex-col h-full relative bg-slate-900">
            <!-- 상단 상태바 -->
            <div class="h-16 bg-white/95 backdrop-blur border-b border-slate-200 flex items-center justify-between px-5 z-30 shrink-0 shadow-sm">
                <div class="flex items-center space-x-2">
                    <span class="text-2xl drop-shadow-sm">🦌</span>
                    <span id="labelPlayer" class="font-extrabold text-sm text-slate-800">모험가</span>
                </div>
                <div class="flex items-center space-x-3 text-sm font-black">
                    <span class="text-amber-500">⭐ <span id="labelTotalStars">0</span></span>
                    <span class="text-blue-600">⚡ <span id="labelTotalXp">0</span>XP</span>
                </div>
            </div>

            <!-- 네이티브 스크롤 뷰포트 -->
            <div id="mapViewport">
                <div id="mapWorld">
                    <div class="biome-map absolute inset-0"></div>
                    
                    <svg class="absolute top-0 left-0 w-full h-full pointer-events-none">
                        <path id="pathBackground" d="" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="24" stroke-linecap="round" stroke-dasharray="12 12" />
                        <path id="pathFill" d="" fill="none" stroke="#facc15" stroke-width="24" stroke-linecap="round" />
                    </svg>

                    <div id="decorationsLayer" class="absolute inset-0 pointer-events-none"></div>
                    <div id="nodesContainer" class="absolute inset-0"></div>

                    <!-- 아바타 핀 (맵 위 걷는 사슴) -->
                    <div id="avatarContainer" class="absolute" style="z-index: 50; transform: translate(-50%, -50%); pointer-events: none;">
                        <div id="mapAvatar" class="text-5xl drop-shadow-md">🦌</div>
                    </div>
                </div>
            </div>

            <!-- 하단 입장 버튼 -->
            <div class="p-4 bg-white/95 backdrop-blur border-t border-slate-200 z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                <button id="btnEnterCurrentStage" onclick="enterStage()" class="duo-btn w-full bg-blue-500 hover:bg-blue-400 text-white font-black text-lg py-4 rounded-2xl">
                    스테이지 1 입장
                </button>
            </div>
        </div>

        <!-- ================= 화면 3: 전투 & 문제 풀이 ================= -->
        <div id="screenBattle" class="hidden flex-1 flex-col h-full bg-slate-50 p-5 justify-between relative">
            <div class="flex items-center justify-between pt-1 mb-4">
                <button onclick="exitBattlePrompt(false)" class="text-slate-400 font-black text-sm p-2 hover:text-slate-600">✕ 도망</button>
                <div class="flex space-x-2" id="battleProgressDots">
                    <!-- JS로 동적 렌더링 -->
                </div>
                <div class="flex flex-col items-end w-24">
                    <span class="text-[10px] font-black text-slate-500 mb-0.5 tracking-wider">PLAYER HP</span>
                    <div class="w-full h-3.5 bg-slate-200 rounded-full overflow-hidden shadow-inner border border-slate-300">
                        <div id="barPlayerHp" class="hp-bar-inner h-full bg-emerald-500" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div class="text-center py-4 shrink-0 flex flex-col items-center justify-center relative">
                <div id="battleMonster">💧</div>
                <div class="w-40 mt-4 bg-white p-2 rounded-xl shadow-sm border border-slate-100">
                    <div class="text-xs font-black text-slate-700 mb-1" id="labelMonsterName">슬라임</div>
                    <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div id="barMonsterHp" class="h-full bg-rose-500 transition-all duration-300" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col justify-end mb-4">
                <div class="mb-4">
                    <span id="labelQuestionTag" class="text-[11px] font-black text-blue-600 bg-blue-100 px-3 py-1 rounded-lg border border-blue-200">개념 분류</span>
                    <h2 id="textQuestionPrompt" class="text-lg md:text-xl font-black text-slate-800 mt-3 leading-snug drop-shadow-sm">문제가 표시됩니다.</h2>
                </div>
                <div id="containerOptions" class="space-y-3"></div>
            </div>

            <div class="pt-2 pb-1 shrink-0 z-10">
                <button id="btnSubmitAnswer" onclick="handleAnswerSubmit()" class="duo-btn w-full bg-slate-300 text-slate-500 font-black text-lg py-4 rounded-2xl" disabled>공격하기 ⚔️</button>
            </div>
            
            <!-- 피드백 팝업 -->
            <div id="modalFeedback" class="absolute bottom-0 left-0 right-0 p-5 transform translate-y-full transition-transform duration-300 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.2)] z-50">
                <div class="flex items-center space-x-3 mb-2">
                    <span id="iconFeedback" class="text-2xl drop-shadow">✨</span>
                    <h3 id="titleFeedback" class="text-xl font-black drop-shadow-sm">결과</h3>
                </div>
                <p id="expFeedback" class="text-xs font-bold opacity-90 leading-relaxed mb-4">해설</p>
                <!-- 다음 버튼 클릭 중복 방지를 위한 안전 장치 탑재 -->
                <button id="btnFeedbackContinue" onclick="handleFeedbackNext()" class="duo-btn w-full bg-white font-black text-base py-3.5 rounded-xl shadow">다음으로</button>
            </div>
        </div>

        <!-- ================= 스테이지 클리어 모달 ================= -->
        <div id="modalStageClear" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur z-50 flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl border-4 border-amber-300 transform transition-all scale-95">
                <div class="text-6xl mb-2 animate-bounce drop-shadow-md">🦌🎉</div>
                <h2 class="text-2xl font-black text-slate-800">스테이지 클리어!</h2>
                <p class="text-xs font-bold text-slate-500 mb-6" id="clearSubtitle">지형 정복 완료</p>

                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-amber-50 p-3 rounded-2xl border border-amber-200 shadow-inner">
                        <span class="text-[10px] font-black text-amber-600 block">획득 별</span>
                        <span class="text-2xl font-black text-amber-500">⭐ +<span id="clearGainedStars">3</span></span>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-2xl border border-blue-200 shadow-inner">
                        <span class="text-[10px] font-black text-blue-600 block">획득 XP</span>
                        <span class="text-2xl font-black text-blue-600">⚡ +<span id="clearGainedXp">60</span></span>
                    </div>
                </div>
                <button onclick="closeClearModalAndReturn()" class="duo-btn w-full bg-green-500 hover:bg-green-400 text-white font-black text-lg py-3.5 rounded-2xl">
                    지도 계속 가기 🗺️
                </button>
            </div>
        </div>

        <!-- ================= 체력 소진(게임오버) 모달 ================= -->
        <div id="modalGameOver" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur z-50 flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl border-4 border-rose-300 transform transition-all scale-95">
                <!-- 힘들어하는 사슴 캐릭터 -->
                <div class="text-6xl mb-4 animate-pulse">🦌💦</div>
                <h2 class="text-2xl font-black text-slate-800 mb-2">체력 소진...</h2>
                <p class="text-sm font-bold text-slate-500 mb-6">별 30개를 소모하여<br>현재 스테이지를 다시 도전하시겠습니까?</p>

                <div class="space-y-3">
                    <button onclick="respawnStage()" class="duo-btn w-full bg-blue-500 hover:bg-blue-400 text-white font-black text-lg py-3.5 rounded-2xl">리스폰 (⭐ -30)</button>
                    <button onclick="exitBattlePrompt(true)" class="duo-btn w-full bg-slate-200 hover:bg-slate-300 text-slate-600 font-black text-lg py-3.5 rounded-2xl">포기하고 마을로</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 문제 데이터 (일반 기업 회계 사례로 완벽 통일) ---
        const STAGE_CONFIG = [
            { id: 1, name: '회계의 숲 입구', biome: 'forest', boss: false, monster: '💧', mName: '슬라임', questions: [
                { tag: '회계 목적', text: '회계의 가장 핵심적인 존재 목적은 무엇일까요?', options: ['단순히 세금을 적게 내기 위해', '정보이용자의 합리적 의사결정을 돕기 위해', '현금 출납 장부를 보관하기 위해'], answer: 1, exp: '회계는 투자자, 채권자 등 이해관계자의 올바른 경제적 의사결정을 돕는 도구입니다.' },
                { tag: '자산 구분', text: '다음 중 기업의 [자산(Asset)]으로 분류되는 항목은?', options: ['생산 설비 및 업무용 차량', '아직 지급하지 않은 외상대금', '은행에서 빌려온 대출금'], answer: 0, exp: '현재 기업이 통제하고 미래 경제적 효익을 창출하는 자원이 자산입니다.' },
                { tag: '회계단위', text: '인위적으로 1년 등의 단위를 끊어서 재무상태를 보고하는 기간은?', options: ['회계기간(회계연도)', '감사주기', '정비주기'], answer: 0, exp: '통상 1년을 1회계기간(회계연도)으로 설정합니다.' }
            ]},
            { id: 2, name: '등식의 언덕', biome: 'forest', boss: false, monster: '🦇', mName: '박쥐', questions: [
                { tag: '회계등식', text: '재무상태표를 구성하는 기본 회계등식으로 올바른 것은?', options: ['자산 = 부채 + 자본', '자본 = 자산 + 부채', '부채 = 자산 + 자본'], answer: 0, exp: '총 자산(재산)은 타인자본(부채)과 자기자본(자본)의 합입니다.' },
                { tag: '자본 계산', text: '보유 자산이 500만 원, 갚아야 할 부채가 200만 원일 때 순수 자본은?', options: ['700만 원', '300만 원', '200만 원'], answer: 1, exp: '자본 = 자산(500) - 부채(200) = 300만 원입니다.' },
                { tag: '손익 계산', text: '1년 동안 총수익 1,000만 원, 총비용 700만 원이 발생했다면 경영성과는?', options: ['당기순손실 300만 원', '당기순이익 300만 원', '자본금 1,700만 원'], answer: 1, exp: '수익에서 비용을 뺀 잔액이 플러스이면 당기순이익입니다.' }
            ]},
            { id: 3, name: '거래의 계곡', biome: 'forest', boss: false, monster: '🐺', mName: '늑대', questions: [
                { tag: '회계상 거래', text: '다음 중 회계상 장부에 기록해야 하는 [거래]는 어느 것일까요?', options: ['신입 사원 3명 채용 계약 체결', '창고의 부품이 화재로 소실됨', '신규 기계장치 도입 구두 약속'], answer: 1, exp: '실제 자산·부채·자본의 금액적 증감 변화를 일으켜야 회계상 거래입니다.' },
                { tag: '거래의 이중성', text: '사무용 PC를 현금 100만 원에 구입했을 때 자산 총액의 변화는?', options: ['100만 원 증가', '100만 원 감소', '총액 변함없음'], answer: 2, exp: '현금(자산) 감소 100만 원, 비품(자산) 증가 100만 원으로 상쇄되어 총액은 동일합니다.' },
                { tag: '차변/대변', text: '복식부기 규칙상 차변(왼쪽)에 올 수 있는 요소는 무엇일까요?', options: ['수익의 발생', '부채의 증가', '비용의 발생'], answer: 2, exp: '차변에는 자산 증가, 부채 감소, 자본 감소, 비용 발생이 기록됩니다.' }
            ]},
            { id: 4, name: '분개의 해변', biome: 'ocean', boss: false, monster: '🦀', mName: '꽃게', questions: [
                { tag: '분개 규칙', text: '거래를 차변과 대변으로 나누어 계정과목과 금액을 기록하는 행위는?', options: ['결산', '분개', '전기'], answer: 1, exp: '거래 발생 시 원인과 결과를 짝지어 최초 기록하는 것이 분개입니다.' },
                { tag: '원장 전기', text: '분개장에 적힌 기록들을 계정과목별 장부로 옮겨 적는 과정은?', options: ['전기(Posting)', '시산', '마감'], answer: 0, exp: '분개장에서 총계정원장으로 이동하여 옮겨 적는 것을 전기라고 합니다.' },

                { tag: '사채 발행', text: '사채 액면이자율(5%)이 시장이자율(8%)보다 낮을 때 사채는 어떻게 발행될까요?', options: ['액면발행', '할인발행', '할증발행'], answer: 1, exp: '시장의 이자보다 낮게 주므로, 그만큼 사채 가격을 깎아서(할인) 발행해야 팔립니다.' },
                { tag: '재무제표 범위', text: '일반기업회계기준에서 공식적으로 규정하는 전체 재무제표 5종에 속하지 않는 것은?', options: ['자본변동표', '현금흐름표', '제조원가명세서'], answer: 2, exp: '재무상태표, 손익계산서, 자본변동표, 현금흐름표, 주석이 5종이며 제조원가명세서는 부속명세서입니다.' }
            ]}
        ];

        // --- 2. 상태 관리 ---
        let userState = {
            name: '모험가',
            currentStage: 1,
            previousStage: 1, 
            stars: 0, xp: 0, hp: 100,
            currentQueue: [],     
            stageCorrectCount: 0, 
            lastAnswerCorrect: false
        };
        const TOTAL_STAGE_QUESTIONS = 3;
        let selectedAnswerIdx = null;
        let isTransitioning = false; // ★ 모달 더블클릭 통과 버그를 막기 위한 비동기 락

        // --- 3. 맵 화면 렌더링 (2D 곡선 계산) ---
        const MAP_TOTAL_HEIGHT = 3800; 

        function getStageNodeCoords(stageFloat, mapWidth) {
            const marginY = 350; 
            const usableH = MAP_TOTAL_HEIGHT - (marginY * 2);
            const stepY = usableH / 9; 
            const y = (MAP_TOTAL_HEIGHT - marginY) - (stageFloat * stepY);

            // 2D 평면에서의 곡선 진폭 극대화
            const centerX = mapWidth / 2;
            const amplitude = mapWidth * 0.40; 
            const x = centerX + Math.sin(stageFloat * 1.5) * amplitude;
            
            return { x, y };
        }

        function handleGameStart() {
            const inputVal = document.getElementById('inputPlayerName').value.trim();
            userState.name = inputVal || '초보 모험가';
            document.getElementById('labelPlayer').innerText = userState.name;

            document.getElementById('screenStart').classList.add('hidden');
            document.getElementById('screenMap').classList.remove('hidden');
            document.getElementById('screenMap').classList.add('flex');

            buildWorldMap();
        }

        function buildWorldMap() {
            const mapArea = document.getElementById('mapWorld');
            const nodesContainer = document.getElementById('nodesContainer');
            const decorLayer = document.getElementById('decorationsLayer');
            const mapWidth = mapArea.clientWidth || 430;

            nodesContainer.innerHTML = '';
            decorLayer.innerHTML = '';

            let d = '';
            for(let f = 0; f <= 9; f += 0.1) {
                const pt = getStageNodeCoords(f, mapWidth);
                d += (f === 0 ? `M ${pt.x} ${pt.y}` : ` L ${pt.x} ${pt.y}`);
            }

            const pathBg = document.getElementById('pathBackground');
            const pathFill = document.getElementById('pathFill');
            pathBg.setAttribute('d', d);
            pathFill.setAttribute('d', d);

            const totalPathLength = pathBg.getTotalLength();
            pathFill.style.strokeDasharray = totalPathLength;
            const clearedRatio = Math.min((userState.currentStage - 1) / 9, 1);
            pathFill.style.strokeDashoffset = totalPathLength * (1 - clearedRatio);

            for(let i=0; i<10; i++) {
                const pt = getStageNodeCoords(i, mapWidth);
                const stageNum = i + 1;
                const conf = STAGE_CONFIG[i];
                
                const wrapper = document.createElement('div');
                wrapper.className = 'absolute';
                wrapper.style.left = `${pt.x}px`;
                wrapper.style.top = `${pt.y}px`;
                wrapper.style.transform = `translate(-50%, -50%)`;

                const node = document.createElement('button');
                let cls = 'stage-btn ';
                if(conf.boss) cls += 'boss ';

                if (stageNum < userState.currentStage) {
                    cls += 'cleared'; node.innerHTML = conf.boss ? '👑' : '⭐';
                } else if (stageNum === userState.currentStage) {
                    cls += 'current'; node.innerHTML = conf.boss ? '⚔️' : stageNum;
                } else {
                    cls += 'locked'; node.innerHTML = conf.boss ? '🔒' : stageNum;
                }

                node.className = cls;
                node.onclick = () => { if(stageNum <= userState.currentStage) enterStage(); };
                
                wrapper.appendChild(node);
                nodesContainer.appendChild(wrapper);
            }

            renderBiomeDecorations(decorLayer, mapWidth);

            if (userState.previousStage < userState.currentStage) {
                animateAvatarWalk(userState.previousStage - 1, userState.currentStage - 1, 1500, mapWidth);
            } else {
                placeAvatarAt(userState.currentStage - 1, mapWidth);
            }
            updateMapBottomUI();
        }

        function renderBiomeDecorations(container, w) {
            const decors = [
                { limit: 1200, emojis: ['🌋', '⛰️', '🔥', '🪨', '💀'] }, 
                { limit: 2500, emojis: ['🌊', '🏖️', '🐚', '🏝️', '⛵'] }, 
                { limit: 3800, emojis: ['🌲', '🌳', '🏕️', '🍄', '🌿'] }  
            ];

            for(let i=0; i<45; i++) {
                const y = 300 + (i * 75);
                const x = (i % 2 === 0) ? (w * 0.1) + (Math.random()*40) : (w * 0.8) - (Math.random()*40);
                
                let emojiList = decors[2].emojis;
                if(y < 1200) emojiList = decors[0].emojis;
                else if(y < 2500) emojiList = decors[1].emojis;

                const el = document.createElement('div');
                el.className = 'absolute text-3xl opacity-80'; 
                el.style.left = `${x}px`; el.style.top = `${y}px`;
                el.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
                container.appendChild(el);
            }
        }

        function placeAvatarAt(stageFloat, mapWidth) {
            const avatarWrapper = document.getElementById('avatarContainer');
            const pt = getStageNodeCoords(stageFloat, mapWidth);
            
            avatarWrapper.style.left = `${pt.x}px`;
            avatarWrapper.style.top = `${pt.y}px`;
            
            setTimeout(() => {
                avatarWrapper.scrollIntoView({ behavior: 'auto', block: 'center' });
            }, 50);
        }

        function animateAvatarWalk(startFloat, endFloat, duration, mapWidth) {
            const avatarWrapper = document.getElementById('avatarContainer');
            const mapAvatar = document.getElementById('mapAvatar');
            const startTime = performance.now();
            
            placeAvatarAt(startFloat, mapWidth);
            
            setTimeout(() => {
                mapAvatar.classList.add('avatar-walk'); 
                const btn = document.getElementById('btnEnterCurrentStage');
                btn.disabled = true; 
                btn.innerText = "이동 중... 🏃";

                function step(currentTime) {
                    const elapsed = currentTime - startTime - 500; 
                    if(elapsed < 0) { requestAnimationFrame(step); return; }

                    const progress = Math.min(elapsed / duration, 1);
                    const easeProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    const currentFloat = startFloat + (endFloat - startFloat) * easeProgress;
                    
                    const pt = getStageNodeCoords(currentFloat, mapWidth);
                    avatarWrapper.style.left = `${pt.x}px`;
                    avatarWrapper.style.top = `${pt.y}px`;
                    
                    avatarWrapper.scrollIntoView({ behavior: 'auto', block: 'center' });
                    
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        mapAvatar.classList.remove('avatar-walk');
                        userState.previousStage = userState.currentStage;
                        updateMapBottomUI();
                        
                        const pathBg = document.getElementById('pathBackground');
                        const pathFill = document.getElementById('pathFill');
                        const totalPathLength = pathBg.getTotalLength();
                        const clearedRatio = Math.min((userState.currentStage - 1) / 9, 1);
                        pathFill.style.transition = "stroke-dashoffset 0.5s ease-out";
                        pathFill.style.strokeDashoffset = totalPathLength * (1 - clearedRatio);
                    }
                }
                requestAnimationFrame(step);
            }, 500);
        }

        function updateMapBottomUI() {
            const btn = document.getElementById('btnEnterCurrentStage');
            btn.disabled = false;
            if (userState.currentStage > 10) {
                btn.innerText = '재오링고 전 과정 수료 완료 🎓';
                btn.onclick = () => alert(`축하합니다! 재오링고의 모든 몬스터를 물리쳤습니다.`);
            } else {
                const conf = STAGE_CONFIG[userState.currentStage - 1];
                btn.innerText = `스테이지 ${userState.currentStage}: ${conf.name} ${conf.boss ? '⚔️' : '입장'}`;
                btn.onclick = () => enterStage();
            }
        }

        // --- 4. 전투 화면 ---
        function enterStage() {
            const stageConfig = STAGE_CONFIG[userState.currentStage - 1];
            userState.currentQueue = JSON.parse(JSON.stringify(stageConfig.questions)); 
            userState.stageCorrectCount = 0;
            userState.hp = 100; // 스테이지 입장 시 체력 리셋
            
            // 입장 시 피드백 모달이 떠있지 않도록 확실히 숨김 처리 (버그 방지)
            document.getElementById('modalFeedback').classList.add('translate-y-full');

            document.getElementById('screenMap').classList.add('hidden'); document.getElementById('screenMap').classList.remove('flex');
            document.getElementById('screenBattle').classList.remove('hidden'); document.getElementById('screenBattle').classList.add('flex');
            renderQuestionBattle();
        }

        function updateHpBarUI() {
            const hpBar = document.getElementById('barPlayerHp');
            hpBar.style.width = `${userState.hp}%`;
            if(userState.hp > 60) hpBar.className = 'hp-bar-inner h-full bg-emerald-500';
            else if(userState.hp > 30) hpBar.className = 'hp-bar-inner h-full bg-amber-500';
            else hpBar.className = 'hp-bar-inner h-full bg-rose-600';
        }

        function renderQuestionBattle() {
            // 새 문제를 렌더링 할 때 피드백 모달이 확실히 숨겨져 있도록 처리
            document.getElementById('modalFeedback').classList.add('translate-y-full');

            const currentStageObj = STAGE_CONFIG[userState.currentStage - 1];
            const q = userState.currentQueue[0]; 
            const mEl = document.getElementById('battleMonster');
            
            mEl.innerText = currentStageObj.monster; mEl.className = ''; 
            document.getElementById('labelMonsterName').innerText = currentStageObj.mName;
            
            const remainingHp = (userState.currentQueue.length / TOTAL_STAGE_QUESTIONS) * 100;
            document.getElementById('barMonsterHp').style.width = `${remainingHp}%`;

            const dotsContainer = document.getElementById('battleProgressDots');
            dotsContainer.innerHTML = '';
            for(let i=0; i<TOTAL_STAGE_QUESTIONS; i++) {
                const dot = document.createElement('div');
                if (i < userState.stageCorrectCount) {
                    dot.className = 'w-8 h-2.5 rounded-full bg-emerald-400 shadow-inner'; 
                } else if (i === userState.stageCorrectCount) {
                    dot.className = 'w-8 h-2.5 rounded-full bg-blue-500 shadow-inner'; 
                } else {
                    dot.className = 'w-8 h-2.5 rounded-full bg-slate-200 shadow-inner'; 
                }
                dotsContainer.appendChild(dot);
            }
            updateHpBarUI();

            document.getElementById('labelQuestionTag').innerText = `${q.tag}`;
            document.getElementById('textQuestionPrompt').innerText = q.text;

            const container = document.getElementById('containerOptions'); container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const optBtn = document.createElement('div');
                optBtn.className = 'option-card p-4 rounded-2xl bg-white text-slate-800 font-bold text-sm md:text-base cursor-pointer shadow-sm';
                optBtn.innerText = opt;
                optBtn.onclick = () => selectOption(idx, optBtn);
                container.appendChild(optBtn);
            });
            selectedAnswerIdx = null; 
            updateSubmitButton();
        }

        function selectOption(idx, el) {
            selectedAnswerIdx = idx;
            document.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
            el.classList.add('selected'); updateSubmitButton();
        }

        function updateSubmitButton() {
            const btn = document.getElementById('btnSubmitAnswer');
            // 선택된 답이 없거나 클릭 처리 중이면(disabled) 막음
            if(selectedAnswerIdx !== null) {
                btn.disabled = false; btn.classList.replace('bg-slate-300', 'bg-blue-600'); btn.classList.replace('text-slate-500', 'text-white');
            } else {
                btn.disabled = true; btn.classList.replace('bg-blue-600', 'bg-slate-300'); btn.classList.replace('text-white', 'text-slate-500');
            }
        }

        function handleAnswerSubmit() {
            const btn = document.getElementById('btnSubmitAnswer');
            if(selectedAnswerIdx === null || btn.disabled) return; 
            
            btn.disabled = true; // 공격 버튼 즉시 잠금
            
            const q = userState.currentQueue[0];
            const isCorrect = (selectedAnswerIdx === q.answer);
            userState.lastAnswerCorrect = isCorrect; 
            
            const mEl = document.getElementById('battleMonster');
            const battleScreen = document.getElementById('screenBattle');

            if(isCorrect) {
                userState.stageCorrectCount++; userState.xp += 20;
                mEl.classList.remove('monster-hit'); void mEl.offsetWidth; mEl.classList.add('monster-hit');
                showInstantFeedback(true, q.exp);
            } else {
                mEl.classList.remove('monster-attack'); battleScreen.classList.remove('player-damage');
                void mEl.offsetWidth; mEl.classList.add('monster-attack');
                
                setTimeout(() => {
                    battleScreen.classList.add('player-damage');
                    userState.hp = Math.max(0, userState.hp - 34); // 3번 틀리면 체력 고갈
                    updateHpBarUI();
                    setTimeout(() => { showInstantFeedback(false, q.exp); }, 400); 
                }, 300); 
            }
        }

        function showInstantFeedback(isCorrect, expText) {
            isTransitioning = false; // 락 해제
            const modal = document.getElementById('modalFeedback');
            const title = document.getElementById('titleFeedback');
            const icon = document.getElementById('iconFeedback');
            const exp = document.getElementById('expFeedback');
            const btn = document.getElementById('btnFeedbackContinue');
            
            btn.disabled = false; // 다음 버튼 활성화
            modal.classList.remove('translate-y-full');

            if(isCorrect) {
                modal.className = modal.className.replace(/bg-\w+-100|text-\w+-900/g, ''); modal.classList.add('bg-emerald-100', 'text-emerald-900');
                icon.innerText = '⚔️'; title.innerText = '공격 명중!';
                btn.className = 'duo-btn w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base py-3.5 rounded-xl shadow';
                btn.innerText = "다음으로";
            } else {
                modal.className = modal.className.replace(/bg-\w+-100|text-\w+-900/g, ''); modal.classList.add('bg-rose-100', 'text-rose-900');
                
                if(userState.hp <= 0) {
                    icon.innerText = '☠️'; title.innerText = '체력 고갈!';
                    btn.className = 'duo-btn w-full bg-rose-600 hover:bg-rose-500 text-white font-black text-base py-3.5 rounded-xl shadow';
                    btn.innerText = "계속하기";
                    expText += '\n\n(체력이 모두 소진되었습니다...)';
                } else {
                    icon.innerText = '🛡️'; title.innerText = '오답! 문제를 큐 맨 뒤로 보냅니다.';
                    btn.className = 'duo-btn w-full bg-rose-600 hover:bg-rose-500 text-white font-black text-base py-3.5 rounded-xl shadow';
                    btn.innerText = "다음으로";
                }
            }
            exp.innerText = expText;
        }

        // ★ 모달 중첩(잔상) 버그가 완벽히 수정된 비동기 로직
        function handleFeedbackNext() {
            const btn = document.getElementById('btnFeedbackContinue');
            if (isTransitioning || btn.disabled) return; // 더블클릭 통과 완벽 차단
            
            isTransitioning = true;
            btn.disabled = true;

            // 모달을 화면 아래로 먼저 내림
            document.getElementById('modalFeedback').classList.add('translate-y-full');
            document.getElementById('screenBattle').classList.remove('player-damage');
            
            // 모달이 완전히 내려갈 때까지(300ms) 대기 후 로직 수행
            setTimeout(() => {
                // 게임오버 체크
                if(userState.hp <= 0) {
                    document.getElementById('modalGameOver').classList.remove('hidden');
                    isTransitioning = false;
                    return; // 리스폰 모달로 통제권 넘김
                }

                // 큐(Queue) 처리 로직
                const completedQuestion = userState.currentQueue.shift(); 
                if (!userState.lastAnswerCorrect) {
                    userState.currentQueue.push(completedQuestion);
                }

                if(userState.currentQueue.length === 0) {
                    const mEl = document.getElementById('battleMonster');
                    document.getElementById('barMonsterHp').style.width = '0%';
                    mEl.style.transform = "scale(0) rotate(90deg)"; mEl.style.opacity = "0";
                    
                    setTimeout(() => { 
                        mEl.style.transform = ""; mEl.style.opacity = ""; 
                        showStageClearResult(); 
                        isTransitioning = false;
                    }, 700);
                } else { 
                    renderQuestionBattle(); 
                    isTransitioning = false;
                }
            }, 300); // CSS Transition 시간과 동일한 300ms 딜레이
        }

        // 리스폰 (게임오버 시 부활)
        function respawnStage() {
            document.getElementById('modalGameOver').classList.add('hidden');
            
            // 별 30개 차감
            userState.stars = Math.max(0, userState.stars - 30);
            document.getElementById('labelTotalStars').innerText = userState.stars;
            
            // 스테이지 상태 완전 초기화
            userState.hp = 100;
            userState.stageCorrectCount = 0;
            
            const stageConfig = STAGE_CONFIG[userState.currentStage - 1];
            userState.currentQueue = JSON.parse(JSON.stringify(stageConfig.questions)); 
            
            // 모달이 닫힌 후 새 문제 렌더링
            setTimeout(() => {
                renderQuestionBattle();
            }, 100);
        }

        function showStageClearResult() {
            const earnedStars = TOTAL_STAGE_QUESTIONS;
            userState.stars += earnedStars; 
            document.getElementById('labelTotalStars').innerText = userState.stars; 
            document.getElementById('labelTotalXp').innerText = userState.xp;
            document.getElementById('clearGainedStars').innerText = earnedStars; 
            document.getElementById('clearSubtitle').innerText = `${STAGE_CONFIG[userState.currentStage - 1].name} 토벌 성공!`;
            document.getElementById('modalStageClear').classList.remove('hidden');
        }

        function closeClearModalAndReturn() {
            document.getElementById('modalStageClear').classList.add('hidden');
            if(userState.currentStage < 10) userState.currentStage++;

            document.getElementById('screenBattle').classList.add('hidden'); document.getElementById('screenBattle').classList.remove('flex');
            document.getElementById('screenMap').classList.remove('hidden'); document.getElementById('screenMap').classList.add('flex');
            
            buildWorldMap(); 
        }

        // 강제 탈주 및 복귀
        function forceExitBattle() {
            document.getElementById('modalGameOver').classList.add('hidden');
            document.getElementById('modalFeedback').classList.add('translate-y-full'); // 예외처리
            
            document.getElementById('screenBattle').classList.add('hidden'); document.getElementById('screenBattle').classList.remove('flex');
            document.getElementById('screenMap').classList.remove('hidden'); document.getElementById('screenMap').classList.add('flex');
            buildWorldMap();
        }

        function exitBattlePrompt(isFromGameOver = false) {
            if(isFromGameOver) {
                forceExitBattle();
            } else {
                if(confirm('전투를 포기하고 마을(지도)로 돌아가시겠습니까?')) {
                    forceExitBattle();
                }
            }
        }
    </script>
</body>
</html>
